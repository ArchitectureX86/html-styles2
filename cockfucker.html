<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hamburger</title>
        <script src="vidplayer.js"></script>
        <style type="text/css" id="ctre_style">
            body {
                background-color: white;
                padding: 0px;
                margin: 0px;
                height: 100vh;
                width: 100vw;
            }

            /*justify-content locks it to the top,
      align-items locks to the left,
      align-self locks self to the left*/

            #container {
                height: 100%;
                width: 100%;
                z-index: -2;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .window1 {
                height: 50%;
                width: 50%;
                padding: 10px;
                background-color: blue;
            }
            
            .col {
                height: 100%;
                width: 100%;
                display: flex;
                flex-flow: column;
            }
            
            .box1 {
                height: 100%;
                width: 100%;
            }
            
            .box2 {
                height: 100%;
                width: 100%;
                background-color: cyan;
            }
            
        </style>
    </head>
    <body>
        <div id="container">
            <div class="window1">
                <div class="col">
                    <div class="box1" style="background-color: green;"></div>
                    <div class="box1" style="background-color: red;">
                        <div class="box2"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
