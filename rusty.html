<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamburger</title>
    <script src="vidplayer.js"></script>
    <style type="text/css" id="ctre_style">
      body {
        background-color: white;
        padding: 0px;
        margin: 0px;
        height: 100vh;
        width: 100vw;
      }

      /*justify-content locks it to the top,
      align-items locks to the left,
      align-self locks self to the left*/

      #container {
        height: 100%;
        width: 100%;
        z-index: -2;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .bg_container {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: row;
        background-color: white;
        position: absolute;
        z-index: -1;
      }

      .bg_gradient {
        height: 100%;
        width: 100%;
        background-image: linear-gradient(90deg, grey 50%, darkgrey 0%);
      }

      .btntainer {
        height: 50px;
        width: 100%;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        bottom: 0px;
      }

      .volumeslider {
        height: 10px;
        appearance: none;
        background: linear-gradient(hsla(0, 0%, 100%, 0.75), #00000040 50%, 75%, #ffffff40);
        border-radius: 999px;
        box-shadow: 0px 0px 10px;
        backdrop-filter: blur(5px);
        outline: 1px solid #ffffff80;
        position: absolute;
        right: 15px;
      }

      .volumeslider::-webkit-slider-thumb {
        transition:
          width 0.4s,
          height 0.2s;
        appearance: none;
        width: 15px;
        height: 15px;
        background: linear-gradient(135deg, white, #00000040 50%, 75%, #ffffff80);
        border-radius: 50%;
        box-shadow: 0px 0px 10px;
        backdrop-filter: blur(5px);
        outline: 1px solid #ffffff60;
        cursor: pointer;
        transform: translateY(-20px);
      }
      .volumeslider::-webkit-slider-thumb:hover {
        width: 20px;
        height: 20px;
      }

      .playpause {
        height: 30px;
        width: 30px;
        background: linear-gradient(135deg, hsla(0, 0%, 100%, 0.75), #00000040 50%, 75%, #ffffff80);
        border-radius: 100%;
        box-shadow: 0px 0px 10px black;
        border: none;
        outline: 1px solid #ffffff80;
        padding: 0px;
        margin: 0px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        left: 15px;
      }

      .square {
        height: 45%;
        width: 45%;
        background: #00000040;
        box-shadow: #ffffff80 0px 0px 6px inset;
        outline: 1px solid #ffffff80;
        border-radius: 33%;
      }

      .glassbox {
        height: 50%;
        width: 50%;
        background-color: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        box-shadow: 0px 0px 8px black;
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 100px;
      }

      .col {
        height: 100%;
        width: 100%;
        display: flex;
        flex-flow: column;
      }

      .content-1 {
        height: 100%;
        width: 100%;
        min-height: 0%;
        min-width: 0%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        box-shadow: 0px 0px 8px black;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .content-1 img {
        transition: filter 0.75s;
        filter: blur(2px) brightness(0.75) grayscale(0.25);
        height: 100%;
        width: 100%;
        object-fit: cover;
        border-radius: inherit;
      }

      .content-1 img:hover {
        filter: blur(0px) brightness(1) grayscale(0);
      }

      .videotainer {
        height: 100%;
        width: 100%;
        border-radius: inherit;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .videotainer video {
        transition: filter 0.75s;
        filter: blur(2px) brightness(0.75) grayscale(0.25);
        height: 100%;
        width: 100%;
        object-fit: cover;
        border-radius: inherit;
      }

      .videotainer video:hover {
        filter: blur(0px) brightness(1) grayscale(0);
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="bg_container">
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
        <div class="bg_gradient"></div>
      </div>
      <div class="glassbox">
        <div class="col">
          <div class="content-1"><img src="images/BlissHD.png" /></div>
          <div class="content-1">
            <div class="videotainer">
              <video id="basevideo" width="320" height="240" onloadstart="this.volume=0.05">
                <source src="videos\Queen of Venus ft. Adachi Rei.mp4" type="video/mp4" />
                Your browser does not support the video tag.
              </video>
              <!-- add buttons -->
              <div class="btntainer">
                <button class="playpause" onclick="playPause()">
                  <div class="square"></div>
                </button>
                <input
                  class="volumeslider"
                  id="myRange"
                  type="range"
                  min="0"
                  max="100"
                  value="10"
                  step="1"
                  oninput="SetVolume(this.value)"
                  onchange="SetVolume(this.value)" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
